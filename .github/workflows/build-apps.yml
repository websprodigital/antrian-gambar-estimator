name: Build Mobile & Windows Apps

on:
  push:
    branches:
      - apps
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Mobile Dependencies & Sync Web Assets
        working-directory: mobile-app
        run: |
          npm ci || npm install
          npm run sync:android

      - name: Build Android APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Antrian-Gambar-Estimator-v1.1.0-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antrian-Gambar-Estimator-Android-APK
          path: mobile-app/android/app/build/outputs/apk/release/Antrian-Gambar-Estimator-v1.1.0-Android.apk

  build-windows:
    name: Build Windows Desktop Installer & Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Desktop Dependencies & Build Windows EXE
        working-directory: windows-app
        run: |
          npm ci || npm install
          npm run dist:win

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antrian-Gambar-Estimator-Windows-EXE
          path: |
            windows-app/dist/*.exe
            !windows-app/dist/*unpacked*

  verify-ios-project:
    name: Verify iOS Xcode Project (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync iOS Assets & Archive Unsigned Build
        working-directory: mobile-app
        run: |
          npm ci || npm install
          npm run sync:ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  publish-release:
    name: Publish GitHub Release v1.1.0
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android & Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect Release Files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp -v {} release-files/ \;
          ls -lh release-files/

      - name: Create or Update GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.0"
          TITLE="Antrian Gambar Estimator v1.1.0 (Live HTML Update on Refresh)"
          {
            echo 'Rilis **v1.1.0** dengan fitur **Live Update HTML & Script Tanpa Install Ulang** — cukup edit `index.html` di branch `gh-pages` lalu klik **Refresh** (`🔄`) / tarik layar / tekan `F5` di aplikasi!'
            echo ''
            echo '### Fitur Baru v1.1.0'
            echo '- **Auto-Update HTML & Script Saat Refresh**: Windows, Android, dan iOS otomatis mengunduh `index.html` terbaru dari `gh-pages` saat Refresh atau buka ulang aplikasi, sambil tetap mempertahankan mode Offline-First & login tersimpan.'
            echo '- **Tombol Refresh Bawaan + Pull-to-Refresh + Shortcut `F5`/`Ctrl+R`**: Tersedia di Header portal, halaman Login, Menu/Tray Windows, dan gesture tarik layar di Mobile.'
            echo ''
            echo '### File Tersedia'
            echo '- **Android** (`Antrian-Gambar-Estimator-v1.1.0-Android.apk`): Installer APK untuk perangkat Android.'
            echo '- **Windows Installer** (`Antrian-Gambar-Estimator-Setup-1.1.0.exe`): Installer Windows x64 dengan shortcut Desktop, Start Menu, dan System Tray notifikasi real-time.'
            echo '- **Windows Portable** (`Antrian-Gambar-Estimator-Portable-1.1.0.exe`): Versi portable Windows x64 yang langsung dijalankan tanpa instalasi.'
            echo '- **iOS (Xcode Project)**: Source Capacitor iOS tersedia pada branch `apps` di folder `mobile-app/ios/App` untuk di-build menggunakan Xcode di macOS.'
          } > release-notes.txt
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber -R "${{ github.repository }}"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.txt -R "${{ github.repository }}"
          else
            gh release create "$TAG" release-files/* --target "${{ github.ref_name }}" --title "$TITLE" --notes-file release-notes.txt --latest -R "${{ github.repository }}"
          fi
