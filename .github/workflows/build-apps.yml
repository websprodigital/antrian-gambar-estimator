name: Build Mobile & Windows Apps

on:
  push:
    branches:
      - apps
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Mobile Dependencies & Sync Web Assets
        working-directory: mobile-app
        run: |
          npm ci || npm install
          npm run sync:android

      - name: Build Android APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antrian-Gambar-Estimator-Android-APK
          path: mobile-app/android/app/build/outputs/apk/release/*.apk

  build-windows:
    name: Build Windows Desktop Installer & Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Desktop Dependencies & Build Windows EXE
        working-directory: windows-app
        run: |
          npm ci || npm install
          npm run dist:win

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antrian-Gambar-Estimator-Windows-EXE
          path: |
            windows-app/dist/*.exe
            !windows-app/dist/*unpacked*

  verify-ios-project:
    name: Verify iOS Xcode Project (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync iOS Assets & Archive Unsigned Build
        working-directory: mobile-app
        run: |
          npm ci || npm install
          npm run sync:ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
